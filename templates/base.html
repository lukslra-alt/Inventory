<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">


    <title>
        {% block title %}
        InventoryPro
        {% endblock %}
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>


<body>


<nav class="navbar navbar-dark bg-dark">
    <div class="container">
    <div class="navbar-left">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            📦 InventoryPro
        </a>
        <a class="navbar-brand" href="{% url 'price_categories' %}">
            💲PriceList
        </a>
    </div>

        {% if user.is_authenticated %}
        <a class="btn btn-outline-light navbar-right" href="/accounts/logout/">Logout</a>
        {% endif %}
        </div>
</nav>


<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>


</body>

</html>
