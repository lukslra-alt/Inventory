<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">


    <title>
        {% block title %}
        InventoryPro
        {% endblock %}
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>


<body>


<nav class="navbar navbar-dark bg-dark">
    <div class="container">
    <div class="navbar-left">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            📦 InventoryPro
        </a>
        <a class="navbar-brand" href="{% url 'price_categories' %}">
            💲PriceList
        </a>
    </div>
        {% if request.user.is_staff %}

        <a href="{% url 'manual_sync' %}"
           class="btn btn-warning btn-sm me-2"
           onclick="return confirm('Synchronize InventoryPro with the latest Google Sheet?');">

            🔄 Sync Now

        </a>

        {% endif %}
        {% if user.is_authenticated %}
        <a class="btn btn-outline-light navbar-right" href="/accounts/logout/">Logout</a>
        {% endif %}
        </div>
</nav>


<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>
{% load static %}
    <!-- Progressive Web App Service Worker Registration -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{% static 'service-worker.js' %}");
            });
        }
    </script>
<!-- Core Offline Functionality Engines -->
    <script src="{% static 'inventory/network.js' %}"></script>
    <script src="{% static 'inventory/offline-db.js' %}"></script>
    <script src="{% static 'inventory/product-loader.js' %}"></script>

    <!-- CRITICAL FIX: Use the official CDN to guarantee it loads -->
    <script src="{% static 'inventory/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Custom dependent application scripts load absolute last -->
    <script src="{% static 'inventory/js/dashboard.js' %}"></script>
    <script src="{% static 'inventory/js/search.js' %}"></script>
</body>

</html>
