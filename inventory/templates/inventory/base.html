<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventoryPro</title>
    {% load static %}
    <link href="{% static 'inventory/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventory/css/dashboard.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#F57C00">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InventoryPro">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
</head>
<body>
    <!-- Network Banner Status -->
    <div id="network-status" class="alert alert-success text-center mb-0 rounded-0">
        🟢 Online - Live Data
    </div>

    <!-- Navigation Header -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">InventoryPro</span>
            <div class="text-white">
                <span>{{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light ms-2">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main View Workspace Injection Matrix -->
    <div class="container-fluid mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
