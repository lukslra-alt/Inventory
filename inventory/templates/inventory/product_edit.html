{% extends "base.html" %}


{% block title %}
Edit Product
{% endblock %}


{% block content %}


<div class="card">

<div class="card-body">


<h4>
Edit Product
</h4>


<hr>


<div class="mb-3">

<label class="form-label">
Product Name
</label>

    <label>
        <input class="form-control"
               value="{{ product.product_name }}"
               readonly>
    </label>

</div>



<div class="mb-3">

<label class="form-label">
Current Quantity
</label>

    <label>
        <input class="form-control"
               value="{{ product.qty }}"
               readonly>
    </label>

</div>



<div class="mb-3">

<label class="form-label">
Average Cost
</label>

    <label>
        <input class="form-control"
               value="{{ product.cost }}"
               readonly>
    </label>

</div>



<form method="post">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Sales Price
</label>

{{ form.sales_price }}

{{ form.sales_price.errors }}

</div>



<div class="mb-3">

<label class="form-label">
Reorder Qty
</label>

{{ form.reorder_qty }}

{{ form.reorder_qty.errors }}

</div>



<button class="btn btn-primary">
Save
</button>


<a href="{% url 'dashboard' %}"
class="btn btn-secondary">

Cancel

</a>


</form>


</div>

</div>


{% endblock %}
